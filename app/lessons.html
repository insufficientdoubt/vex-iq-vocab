<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab by STEM Lab</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1b1f24; --muted: #667085; --line: #e3e6ea;
    --accent: #0a6cc4; --accent-soft: #e6f0fa; --chip: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171b; --panel: #1d2126; --text: #e8eaed; --muted: #9aa3ad; --line: #2c3238;
            --accent: #5aa9f0; --accent-soft: #1f3347; --chip: #262b31; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
           position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 17px; margin: 0 0 6px; }
  header nav { display: flex; gap: 4px; flex-wrap: wrap; }
  header nav a { padding: 2px 8px; border-radius: 6px; background: var(--chip); color: var(--text);
                 text-decoration: none; font-size: 13px; white-space: nowrap; }
  header nav a:hover { background: var(--accent-soft); color: var(--accent); }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .intro { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px;
            margin-bottom: 16px; scroll-margin-top: 90px; }
  h2 { font-size: 19px; margin: 0 0 4px; }
  h3 { font-size: 15px; margin: 14px 0 2px; }
  h3 a, h2 a { color: inherit; text-decoration: none; }
  h3 a:hover, h2 a:hover { color: var(--accent); }
  .concepts { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: minmax(130px, 220px) 1fr; gap: 12px; padding: 5px 0;
       border-top: 1px solid var(--line); }
  li a { color: var(--accent); font-weight: 600; text-decoration: none; }
  li a:hover { text-decoration: underline; }
  .error { background: #fde8e8; color: #8a1c1c; padding: 12px; border-radius: 8px; }
  @media (max-width: 600px) { li { grid-template-columns: 1fr; gap: 0; } }
</style>
</head>
<body>
<header>
  <h1>Vocab by STEM Lab <span style="font-weight:400;color:var(--muted)">· teacher reference</span></h1>
  <nav id="jump"></nav>
</header>
<main id="main"></main>
<script>
// Teacher reference: vocab grouped by the VEX IQ (2nd gen) STEM Lab lesson that first teaches it (the
// stem_lab column). Not linked from the student app. Each term links to its card in index.html.
const DATA = "../data/vocab.csv", LABS = "../sources/iq-stem-labs.csv";
const DOMAIN_ORDER = ["BLD", "CODE", "ENG", "EDP", "COMP", "SEASON"];

// Minimal RFC 4180 CSV parser (same as index.html).
function parseCSV(text) {
  const out = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); out.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field || row.length) { row.push(field); out.push(row); }
  const [head, ...body] = out;
  return body.filter(r => r.some(Boolean)).map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""])));
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const get = url => fetch(url, { cache: "no-cache" }).then(r => {
  if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
  return r.text();
});

Promise.all([get(DATA), get(LABS)]).then(([v, l]) => {
  const rows = parseCSV(v).filter(r => r.stem_lab);
  const lessons = parseCSV(l);  // already in pacing order
  const byLesson = {};
  for (const r of rows) (byLesson[r.stem_lab] ??= []).push(r);
  const rank = r => DOMAIN_ORDER.indexOf(r.domain);
  let html = `<p class="intro">${rows.length} terms, listed under the lesson where VEX's IQ STEM Labs first teach them.
    Units are in the order of VEX's Cumulative Pacing Guide, which is a suggested order. Lessons that teach no vocab terms are left out.</p>`;
  let jump = "";
  for (const unit of [...new Set(lessons.map(x => x.unit))]) {
    const ls = lessons.filter(x => x.unit === unit && byLesson[x.id]);
    if (!ls.length) continue;
    const name = ls[0].unit_name;
    jump += `<a href="#u${unit}">${unit} ${esc(name)}</a>`;
    html += `<section id="u${unit}"><h2>${unit} · ${esc(name)}</h2>`;
    for (const x of ls) {
      const terms = byLesson[x.id].sort((a, b) => rank(a) - rank(b) || a.id.localeCompare(b.id));
      html += `<h3><a href="${esc(x.url)}" target="_blank" rel="noopener">${x.id} · ${esc(x.lesson_name)} ↗</a></h3>
        <p class="concepts">${esc(x.concepts)}</p><ul>` +
        terms.map(r => `<li><a href="index.html#id=${encodeURIComponent(r.id)}">${esc(r.term_en)}</a><span>${esc(r.short_def)}</span></li>`).join("") +
        `</ul>`;
    }
    html += `</section>`;
  }
  document.getElementById("jump").innerHTML = jump;
  document.getElementById("main").innerHTML = html;
}).catch(e => { document.getElementById("main").innerHTML =
  `<div class="error">Couldn't load the data (${esc(e.message)}). Open this page through a web server, e.g. <code>python3 -m http.server</code> in the repo folder, then <code>http://localhost:8000/app/lessons.html</code>.</div>`; });
</script>
</body>
</html>
