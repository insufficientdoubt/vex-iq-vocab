<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catapult mechanisms</title>
<link rel="stylesheet" href="embed.css">
<style>
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 270px; gap: 10px; }
  svg { width: 100%; height: 100%; min-height: 0; border: 1px solid var(--line); border-radius: var(--r); background: #fbfcfe; }
  .panel { display: flex; flex-direction: column; gap: 6px; padding: 10px; overflow: auto; font-size: 14px; line-height: 1.3; }
  .steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .steps li { padding: 6px 8px; border-radius: var(--r-sm); border: 1px solid transparent; color: var(--muted); }
  .steps li b { color: var(--ink); }
  .steps li.now { border-color: var(--accent); background: #e6edf7; color: var(--ink); }
  .meter { flex: none; height: 12px; border-radius: 6px; background: #e3e8ef; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: #d6458f; }
</style>
</head>
<body>
  <div class="bar">
    <button data-mode="choo">Choo choo (standoffs)</button>
    <button data-mode="tfling">T-Fling</button>
    <button data-mode="cam">Drop cam</button>
    <button data-mode="latch">Winch, latch and trigger</button>
    <span class="grow"></span>
    <button id="slow">Slow motion</button>
    <button class="primary" id="play">❚❚ Pause</button>
  </div>
  <div class="main">
    <svg id="svg" viewBox="0 0 900 600" aria-label="A catapult"></svg>
    <div class="panel box">
      <div class="label">Rubber band stretch</div>
      <div class="meter"><i id="meter"></i></div>
      <div class="label">How it works</div>
      <ol class="steps" id="steps"></ol>
      <div class="note" id="tip"></div>
    </div>
  </div>

<script>
  /*
    A rubber-band catapult, side view. The arm turns on a pivot P. A rubber band joins the arm to
    the top of the front post: pulling the arm back stretches it, and letting go lets it snap the
    arm forward until it hits the stop bar. The ball keeps going.

    Three ways to pull the arm back and let it go:
      choo   ("choo choo") a motor turns two large gears with 3 standoffs between them. A standoff
             pushes a bar on the arm (pulling the arm back) until it slides past the bar's end: then
             nothing holds the arm. (VEX IQ parts can't be cut, so there's no slip gear.)
      tfling a motor turns two 60-tooth gears. A two-piece tensioning arm is pinned to the gears;
             a shaft bushing on the other side of the gears' centre catches it at its hinge and pulls
             the catapult arm down. Just past the over-center point the bushing slides off and the
             tensioning arm goes slack (still pinned). From VEX's description of Fling, the 2021-22
             Hero Bot; where the bushing touches the arm is our reading, not checked against photos.
      cam    a motor turns a drop cam (snail-shaped; VEX calls it a drop cam). It pushes the arm's short tail, slowly pulling the
             arm back, then the tail falls off the cam's step.
      latch  wind a string onto a spool to pull the arm back, a latch hooks the arm, let the string
             go slack, then pull the trigger to open the latch.

    Angles: degrees, measured like in math (0° points forward, 90° up). The arm rests at REST
    (against the stop bar) and is fully pulled back at LOADED.
  */
  const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("svg");
  const OX = 420, OY = 290;                        // where the pivot P is drawn
  const X = function (x) { return OX + x; }, Y = function (y) { return OY - y; };
  const REST = 115, LOADED = 190, ARM = 215, BAND_AT = 95, TAIL = 45;
  const ANCHOR = [150, 55];                        // top of the front post, where the band is tied
  const GROUND = -275;
  const rad = function (d) { return d * Math.PI / 180; };
  const pt = function (len, deg) { return [len * Math.cos(rad(deg)), len * Math.sin(rad(deg))]; };
  function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).append(e); return e; }
  function set(e, attrs) { for (const k in attrs) e.setAttribute(k, attrs[k]); }

  const MODES = {
    choo: { steps: [
      "<b>1. Pull back.</b> The motor turns two large gears. A standoff between them pushes the bar on the arm, so the arm goes back and the rubber band stretches.",
      "<b>2. Slipping off.</b> The standoff slides to the end of the bar…",
      "<b>3. Launch!</b> The standoff passes the end of the bar. Nothing holds the arm now: the rubber band snaps it forward and the ball flies.",
      "<b>4. Again.</b> The next standoff comes round and catches the bar. Three standoffs: three shots each time the gears go round.",
    ], tip: "Teams often call this a “choo choo” launcher. It uses only normal VEX IQ parts: two large gears with 3 standoffs between them. The motor only ever turns one way: no switch, no trigger." },
    tfling: { steps: [
      "<b>1. Pull down.</b> The motor turns two 60-tooth gears. The tensioning arm is pinned to the gears. A bushing on the other side of the gears catches it at its hinge and pulls the catapult arm down.",
      "<b>2. Over center.</b> The bushing reaches the far side of the gears, where it pulls hardest. (Fling stops here with a bumper switch, so the driver chooses when to shoot.)",
      "<b>3. Launch!</b> Just past that point, the bushing slides off the tensioning arm. It is still pinned to the gears, but it goes slack, so the rubber band snaps the catapult arm forward.",
      "<b>4. Again.</b> The gears keep turning, and the bushing catches the tensioning arm again.",
    ], tip: "From Fling, VEX's 2021-22 Hero Bot. Like the choo choo, a post on turning gears catches and slides off. But here the tensioning arm is pinned to the gears, so it is always ready to be caught again." },
    cam: { steps: [
      "<b>1. Push back.</b> The motor turns the drop cam. As it turns, it gets wider and pushes the arm's tail, so the arm goes back and the rubber band stretches.",
      "<b>2. The step.</b> The tail reaches the cam's step, where it suddenly gets narrow…",
      "<b>3. Launch!</b> The tail falls off the step. The rubber band snaps the arm forward and the ball flies.",
      "<b>4. Again.</b> The cam keeps turning until it reaches the tail again.",
    ], tip: "A drop cam (also called a snail cam, from its shape) turns round and round in one direction, like the choo choo. The step must be sharp, so the arm drops off cleanly." },
    latch: { steps: [
      "<b>1. Wind.</b> Turn the spool. The string pulls the arm back and stretches the rubber band.",
      "<b>2. Latch.</b> The latch swings in and hooks the arm.",
      "<b>3. Let go of the string.</b> The string goes slack. Only the latch holds the arm now.",
      "<b>4. Fire!</b> Pull the trigger: the latch swings away and the rubber band snaps the arm forward.",
    ], tip: "The latch lets you load first and fire later: aim, wait for the signal, then pull the trigger." },
  };

  /* ---- The drawing ---- */
  el("rect", { x: 0, y: Y(GROUND), width: 900, height: 40, fill: "#e9edf2" });
  el("rect", { x: X(-270), y: Y(GROUND + 22), width: 470, height: 22, rx: 4, fill: "#c9a46a", stroke: "#9b7a46" });   // the base board
  el("rect", { x: X(-9), y: Y(-8), width: 18, height: GROUND * -1 - 22 + 8, fill: "#b48c55" });                      // pivot post
  el("rect", { x: X(ANCHOR[0] - 8), y: Y(ANCHOR[1] + 6), width: 16, height: ANCHOR[1] + 6 - GROUND - 22, fill: "#b48c55" });   // front post
  const STOP = pt(150, REST - 6);
  const band = el("line", { stroke: "#d6458f", "stroke-width": 5, "stroke-linecap": "round" });
  const mech = el("g", {});        // the gears, cam or latch: redrawn each frame
  const arm = el("g", {});
  el("line", { x1: 0, y1: 0, x2: ARM, y2: 0, stroke: "#10233f", "stroke-width": 12, "stroke-linecap": "round" }, arm);
  const tail = el("line", { x1: 0, y1: 0, x2: -TAIL, y2: 0, stroke: "#10233f", "stroke-width": 12, "stroke-linecap": "round" }, arm);
  const roller = el("circle", { cx: -TAIL, cy: 0, r: 9, fill: "#fff", stroke: "#10233f", "stroke-width": 3 }, arm);
  el("path", { d: `M${ARM - 30} 6 q 30 38 60 0`, fill: "#8a97a8", stroke: "#10233f", "stroke-width": 3 }, arm);   // the cup, on the side the arm swings towards
  el("circle", { cx: 0, cy: 0, r: 8, fill: "#fff", stroke: "#10233f", "stroke-width": 3 });
  set(svg.lastChild, { cx: X(0), cy: Y(0) });
  el("circle", { cx: X(STOP[0]), cy: Y(STOP[1]), r: 10, fill: "#5b6b80" });                                         // stop bar (end on)
  el("text", { x: X(STOP[0]) + 16, y: Y(STOP[1]) + 5, "font-size": 15, fill: "#5b6b80" }).textContent = "stop bar";
  const ball = el("circle", { r: 13, fill: "#ff8c0f", stroke: "#b85d00", "stroke-width": 2 });
  const trail = el("polyline", { fill: "none", stroke: "#ff8c0f", "stroke-width": 2, "stroke-dasharray": "4 6", opacity: 0.8 });

  /* ---- State ---- */
  let mode = "choo", phi = REST, omega = 0, free = false, motor = 0, clock = 0, slow = false, playing = true;
  let flying = null, trailPts = [], step = 0, releasedAt = -9;

  function bandStretch(a) {   // how much longer than at rest the rubber band is (0 to 1)
    const at = function (d) { const p = pt(BAND_AT, d); return Math.hypot(p[0] - ANCHOR[0], p[1] - ANCHOR[1]); };
    return Math.max(0, (at(a) - at(REST)) / (at(LOADED) - at(REST)));
  }

  /* ---- Each mechanism: given the motor (or the clock), how far back is the arm held? ---- */
  // Choo choo: a bar on the arm, LEVER long, points the other way from the arm. The gears (centre CG)
  // turn clockwise; their standoffs (on a circle of radius CR) cross the bar's reach from below the
  // resting bar (arm at REST) to the bar's end when the arm is at LOADED. A standoff inside the reach
  // and in the bar's path holds the bar at its own angle; once it passes the end, the arm is free.
  const CG = [74.8, -47.5], CR = 60, LEVER = 70, CGEAR = 68, DRIVE = 30, DG = pt(CGEAR + DRIVE + 8, -100);
  let chooTurn = 0, chooHeld = false, chooFired = -9;
  const standoff = function (k) { return pt(CR, chooTurn + 120 * k).map(function (v, i) { return v + CG[i]; }); };
  function chooHold() {
    chooTurn = 200 - motor;   // clockwise; standoff 0 starts just outside the bar's reach
    let hold = null;
    for (let k = 0; k < 3; k++) {
      const S = standoff(k);
      if (Math.hypot(S[0], S[1]) > LEVER) continue;   // past the end of the bar
      const p = ((Math.atan2(S[1], S[0]) * 180 / Math.PI - 180) % 360 + 360) % 360;   // the arm angle that puts the bar on it
      if (p >= REST && p <= LOADED + 15) hold = hold === null ? p : Math.max(hold, p);
    }
    if (chooHeld && hold === null) chooFired = clock;
    chooHeld = hold !== null;
    step = hold !== null ? (hold > LOADED - 8 ? 1 : 0) : clock - chooFired < 0.8 ? 2 : clock < 0.8 ? 0 : 3;
    return hold;   // null: nothing holds the arm
  }
  // T-Fling: two gears (centre TG). The tensioning arm has two pieces joined by a hinge: the lower
  // piece (2 × TR long) is pinned to the gears at the pin, TR from the centre; the upper piece (TLINK
  // long) goes to the point TA along the catapult arm. The shaft bushing is TR from the centre on the
  // other side, so when it catches the hinge, the lower piece lies across the gears and the bushing
  // pulls through the upper piece. Once the bushing passes the far side (the over-center point,
  // where the hold starts to fall) it slides off, and it catches the hinge again near the top.
  const TG = [-90, -150], TR = 50, TA = 90, TGEAR = 62, TDRIVE = 26, TDG = pt(TGEAR + TDRIVE + 8, 200);
  const aAt = function (a) { return pt(TA, a); };
  const TUP = Math.atan2(aAt(REST)[1] - TG[1], aAt(REST)[0] - TG[0]) * 180 / Math.PI;   // from the gears towards the resting arm
  const TLINK = Math.hypot(aAt(REST)[0] - TG[0], aAt(REST)[1] - TG[1]) - TR + 4;
  let tTurn = 0, tHooked = true, tLast = REST, tFired = -9, tTaut = false;
  const tOn = function (deg) { const q = pt(TR, deg); return [TG[0] + q[0], TG[1] + q[1]]; };
  const tBush = function () { return tOn(TUP - tTurn); }, tPin = function () { return tOn(TUP - tTurn + 180); };
  function tflingHold() {
    const prev = tTurn % 360;
    tTurn = motor;   // the gears turn clockwise
    const th = tTurn % 360;
    tTaut = false;
    if (th < prev) tHooked = true;   // the bushing is back near the top: it catches the hinge again
    if (!tHooked) { step = clock - tFired < 0.8 ? 2 : 3; return null; }
    const B = tBush(), len = function (a) { const p = aAt(a); return Math.hypot(p[0] - B[0], p[1] - B[1]); };
    let hold = REST;
    if (len(REST) > TLINK) {   // taut: find where the upper piece reaches from the bushing to the arm
      let lo = REST, hi = LOADED + 20;
      for (let i = 0; i < 30; i++) { const mid = (lo + hi) / 2; if (len(mid) > TLINK) lo = mid; else hi = mid; }
      hold = lo; tTaut = true;
    }
    if (th > 90 && hold < tLast - 0.02) { tHooked = false; tTaut = false; tFired = clock; step = 2; tLast = REST; return null; }   // past over center
    tLast = hold;
    step = th > 90 && hold > LOADED - 10 ? 1 : 0;
    return hold;
  }

  // Drop cam: centre C; its radius grows from R0 to R1 as it turns, then drops at the step.
  const C = [-5, -88];
  const tailAt = function (a) { return pt(TAIL, a + 180); };
  const dist = function (a) { const t = tailAt(a); return Math.hypot(t[0] - C[0], t[1] - C[1]); };
  const R1 = dist(LOADED), R0 = dist(REST) - 14;
  function camRadius(worldDeg) { const u = (((worldDeg - camTurn) % 360) + 360) % 360; return R0 + (R1 - R0) * u / 360; }
  let camTurn = 0;
  function camHold() {
    camTurn = -motor;   // the cam turns clockwise
    const f = function (a) { const t = tailAt(a); return camRadius(Math.atan2(t[1] - C[1], t[0] - C[0]) * 180 / Math.PI) - dist(a); };
    if (f(REST) <= 0) { step = clock - releasedAt < 1.4 ? 2 : 3; return null; }
    let lo = REST, hi = LOADED;
    if (f(hi) > 0) return LOADED;
    for (let i = 0; i < 30; i++) { const mid = (lo + hi) / 2; if (f(mid) > 0) lo = mid; else hi = mid; }
    step = lo > LOADED - 6 ? 1 : 0;
    return lo;
  }
  // Winch, latch and trigger: a 7-second routine
  const SPOOL = [-235, -205], LATCH = [-150, -150];
  let latchAngle = 200, slack = 0;
  function latchHold() {
    const c = clock % 7.5;
    if (c < 3) { step = 0; latchAngle = 200; slack = 0; return REST + (LOADED - REST) * (c / 3); }
    if (c < 3.6) { step = 1; latchAngle = 200 - 110 * (c - 3) / 0.6; slack = 0; return LOADED; }
    if (c < 4.8) { step = 2; latchAngle = 90; slack = Math.min(1, (c - 3.6) / 0.8); return LOADED; }
    step = 3; slack = 1;
    latchAngle = c < 5.2 ? 90 + 110 * (c - 4.8) / 0.4 : 200;
    return c < 5.0 ? LOADED : null;
  }

  /* ---- Drawing the mechanism ---- */
  function gear(cx, cy, r, turn, teethFrom, teethTo, color) {
    const n = Math.round(r / 4.2), parts = [];
    for (let i = 0; i < n; i++) {
      const a = 360 * i / n;
      const rel = ((a % 360) + 360) % 360;
      if (rel < teethFrom || rel >= teethTo) continue;
      const w = 360 / n / 2.4, a1 = rad(a + turn - w), a2 = rad(a + turn + w);
      parts.push(`M${cx + r * Math.cos(a1)} ${cy - r * Math.sin(a1)} L${cx + (r + 8) * Math.cos(a1)} ${cy - (r + 8) * Math.sin(a1)} L${cx + (r + 8) * Math.cos(a2)} ${cy - (r + 8) * Math.sin(a2)} L${cx + r * Math.cos(a2)} ${cy - r * Math.sin(a2)}`);
    }
    el("circle", { cx: cx, cy: cy, r: r, fill: color, "fill-opacity": 0.18, stroke: color, "stroke-width": 3 }, mech);
    el("path", { d: parts.join(" "), fill: color, stroke: color, "stroke-width": 1 }, mech);
    el("circle", { cx: cx, cy: cy, r: 5, fill: color }, mech);
  }
  function drawMech() {
    mech.textContent = "";
    if (mode === "choo") {
      // side view: the two large gears are one behind the other, so they look like one gear
      gear(X(CG[0]), Y(CG[1]), CGEAR, chooTurn, 0, 360, "#ff8c0f");
      gear(X(CG[0] + DG[0]), Y(CG[1] + DG[1]), DRIVE, -chooTurn * CGEAR / DRIVE, 0, 360, "#0087ff");
      for (let k = 0; k < 3; k++) { const S = standoff(k); el("circle", { cx: X(S[0]), cy: Y(S[1]), r: 7, fill: "#5b6b80", stroke: "#10233f", "stroke-width": 2 }, mech); }
      el("text", { x: X(170), y: Y(CG[1]) - 4, "font-size": 15, fill: "#b85d00" }, mech).textContent = "2 large gears";
      el("text", { x: X(170), y: Y(CG[1]) + 15, "font-size": 15, fill: "#b85d00" }, mech).textContent = "+ 3 standoffs";
      el("text", { x: X(CG[0] + DG[0] + DRIVE + 14), y: Y(CG[1] + DG[1]) + 5, "font-size": 15, fill: "#0a5cad" }, mech).textContent = "motor";
      const e = pt(LEVER, phi + 180);   // the bar on the arm, drawn over the gears
      el("line", { x1: X(0), y1: Y(0), x2: X(e[0]), y2: Y(e[1]), stroke: "#10233f", "stroke-width": 10, "stroke-linecap": "round" }, mech);
    }
    if (mode === "tfling") {
      gear(X(TG[0]), Y(TG[1]), TGEAR, -tTurn, 0, 360, "#7b4fc9");
      gear(X(TG[0] + TDG[0]), Y(TG[1] + TDG[1]), TDRIVE, tTurn * TGEAR / TDRIVE, 0, 360, "#0087ff");
      el("text", { x: X(TG[0] + TDG[0]) - TDRIVE - 58, y: Y(TG[1] + TDG[1]) + 5, "font-size": 15, fill: "#0a5cad" }, mech).textContent = "motor";
      el("text", { x: X(TG[0]) - 70, y: Y(TG[1] - TGEAR) + 30, "font-size": 15, fill: "#5a3a99" }, mech).textContent = "2 × 60-tooth gears";
      const P = tPin(), B = tBush(), A = aAt(phi);
      // the hinge: on the bushing while it pulls; otherwise wherever the two pieces reach (the fold nearer the bushing)
      let H = B;
      if (!tTaut) {
        const L2 = 2 * TR, d = Math.max(1, Math.hypot(A[0] - P[0], A[1] - P[1])), ux = (A[0] - P[0]) / d, uy = (A[1] - P[1]) / d;
        const along = Math.min(L2, Math.max(-L2, (d * d + L2 * L2 - TLINK * TLINK) / (2 * d))), h = Math.sqrt(Math.max(0, L2 * L2 - along * along));
        const h1 = [P[0] + ux * along - uy * h, P[1] + uy * along + ux * h], h2 = [P[0] + ux * along + uy * h, P[1] + uy * along - ux * h];
        H = Math.hypot(h1[0] - B[0], h1[1] - B[1]) < Math.hypot(h2[0] - B[0], h2[1] - B[1]) ? h1 : h2;
      }
      el("polyline", { points: [A, H, P].map(function (p) { return X(p[0]) + "," + Y(p[1]); }).join(" "), fill: "none", stroke: "#10233f", "stroke-width": 8, "stroke-linecap": "round", "stroke-linejoin": "round", opacity: tTaut ? 1 : 0.6 }, mech);
      el("circle", { cx: X(B[0]), cy: Y(B[1]), r: 9, fill: "#ffd43b", stroke: "#10233f", "stroke-width": 2.5 }, mech);   // the shaft bushing
      el("circle", { cx: X(H[0]), cy: Y(H[1]), r: 4, fill: "#fff", stroke: "#10233f", "stroke-width": 2 }, mech);        // the hinge
      el("circle", { cx: X(P[0]), cy: Y(P[1]), r: 6, fill: "#5b6b80", stroke: "#10233f", "stroke-width": 2 }, mech);     // the pin
      el("circle", { cx: X(A[0]), cy: Y(A[1]), r: 6, fill: "#fff", stroke: "#10233f", "stroke-width": 2 }, mech);
      el("text", { x: X(B[0]) + 14, y: Y(B[1]) + 5, "font-size": 14, fill: "#8a6d00" }, mech).textContent = "bushing";
      el("text", { x: X(P[0]) - 34, y: Y(P[1]) + 5, "font-size": 14, fill: "#5b6b80" }, mech).textContent = "pin";
      if (tTaut) el("text", { x: X(A[0] + (H[0] - A[0]) * 0.3) + 12, y: Y(A[1] + (H[1] - A[1]) * 0.3), "font-size": 15, fill: "#10233f" }, mech).textContent = "tensioning arm";
    }
    if (mode === "cam") {
      const pts = [];
      for (let u = 0; u <= 360; u += 4) { const r = R0 + (R1 - R0) * u / 360, a = rad(u + camTurn); pts.push(`${X(C[0] + r * Math.cos(a))},${Y(C[1] + r * Math.sin(a))}`); }
      el("polygon", { points: pts.join(" "), fill: "#2e9e4f", "fill-opacity": 0.2, stroke: "#2e9e4f", "stroke-width": 3 }, mech);
      el("circle", { cx: X(C[0]), cy: Y(C[1]), r: 6, fill: "#2e9e4f" }, mech);
      el("text", { x: X(C[0]) - 150, y: Y(C[1]) + 6, "font-size": 15, fill: "#1f6b38" }, mech).textContent = "drop cam (motor)";
    }
    if (mode === "latch") {
      // spool and string
      el("circle", { cx: X(SPOOL[0]), cy: Y(SPOOL[1]), r: 20, fill: "#fff", stroke: "#7b4fc9", "stroke-width": 3 }, mech);
      const h = pt(14, -clock * 240);
      el("line", { x1: X(SPOOL[0]), y1: Y(SPOOL[1]), x2: X(SPOOL[0] + h[0]), y2: Y(SPOOL[1] + h[1]), stroke: "#7b4fc9", "stroke-width": 4 }, mech);
      const hook = pt(150, phi);
      const mx = (SPOOL[0] + hook[0]) / 2, my = (SPOOL[1] + hook[1]) / 2 - slack * 70;
      el("path", { d: `M${X(SPOOL[0])} ${Y(SPOOL[1])} Q ${X(mx)} ${Y(my)} ${X(hook[0])} ${Y(hook[1])}`, fill: "none", stroke: "#7b4fc9", "stroke-width": 2.5 }, mech);
      el("text", { x: X(SPOOL[0]) - 30, y: Y(SPOOL[1]) + 40, "font-size": 15, fill: "#5a3a99" }, mech).textContent = "winch";
      // latch: a hooked bar on a pivot; trigger string to the back
      const tip = pt(130, latchAngle);   // long enough that, standing up, its hook goes over the pulled-back arm
      el("line", { x1: X(LATCH[0]), y1: Y(LATCH[1]), x2: X(LATCH[0] + tip[0]), y2: Y(LATCH[1] + tip[1]), stroke: "#c23b3b", "stroke-width": 9, "stroke-linecap": "round" }, mech);
      const hk = pt(16, latchAngle - 90);
      el("line", { x1: X(LATCH[0] + tip[0]), y1: Y(LATCH[1] + tip[1]), x2: X(LATCH[0] + tip[0] + hk[0]), y2: Y(LATCH[1] + tip[1] + hk[1]), stroke: "#c23b3b", "stroke-width": 7, "stroke-linecap": "round" }, mech);
      el("circle", { cx: X(LATCH[0]), cy: Y(LATCH[1]), r: 6, fill: "#c23b3b" }, mech);
      el("line", { x1: X(LATCH[0]), y1: Y(LATCH[1]), x2: X(-330), y2: Y(-120), stroke: "#c23b3b", "stroke-width": 2, "stroke-dasharray": "5 4" }, mech);
      el("text", { x: X(-345), y: Y(-105), "font-size": 15, fill: "#c23b3b" }, mech).textContent = step === 3 ? "pull! ←" : "trigger";
      el("text", { x: X(LATCH[0]) + 12, y: Y(LATCH[1]) + 24, "font-size": 15, fill: "#c23b3b" }, mech).textContent = "latch";
    }
  }

  /* ---- Moving ---- */
  let last = performance.now();
  function frame(now) {
    let dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!playing) dt = 0;
    if (slow) dt *= 0.2;
    clock += dt;
    motor += dt * (mode === "choo" ? 50 : mode === "tfling" ? 110 : 55);   // degrees the motor turns each second
    const hold = mode === "choo" ? chooHold() : mode === "tfling" ? tflingHold() : mode === "cam" ? camHold() : latchHold();
    if (hold !== null && (!free || hold >= phi - 0.5)) {   // the mechanism holds the arm (it's pulling it back)
      phi = hold; omega = 0; free = false;
    } else if (dt > 0) {                                     // free: the rubber band pulls it forward
      if (!free) releasedAt = clock;
      free = true;
      omega -= dt * (900 + 4200 * bandStretch(phi));        // degrees per second, faster the more it's stretched
      phi += omega * dt;
      if (phi <= REST) {                                     // it hits the stop bar: the ball flies
        if (!flying && omega < -150) {
          const tipR = ARM - 15, a = rad(REST), speed = -omega * Math.PI / 180 * tipR * 0.3;
          const side = pt(18, REST - 90);
          flying = { x: tipR * Math.cos(a) + side[0], y: tipR * Math.sin(a) + side[1], vx: speed * Math.sin(a), vy: -speed * Math.cos(a) };
          trailPts = [];
        }
        phi = REST; omega = 0;
      }
    }
    if (flying && dt > 0) {
      flying.vy -= 980 * dt; flying.x += flying.vx * dt; flying.y += flying.vy * dt;
      trailPts.push(`${X(flying.x)},${Y(flying.y)}`);
      if (flying.y < GROUND + 13) { flying.y = GROUND + 13; flying.vx = 0; flying.vy = 0; }
    }
    // the ball goes back in the cup when the arm is pulled back again
    if (flying && !free && phi > REST + 20) { flying = null; trailPts = []; }

    set(arm, { transform: `translate(${X(0)} ${Y(0)}) rotate(${-phi})` });
    const showTail = mode === "cam";
    tail.style.display = roller.style.display = showTail ? "" : "none";
    const b = pt(BAND_AT, phi), s = bandStretch(phi);
    set(band, { x1: X(ANCHOR[0]), y1: Y(ANCHOR[1]), x2: X(b[0]), y2: Y(b[1]), "stroke-width": 6 - 3 * s });
    if (flying) set(ball, { cx: X(flying.x), cy: Y(flying.y) });
    else { const c = pt(ARM - 15, phi), side = pt(18, phi - 90); set(ball, { cx: X(c[0] + side[0]), cy: Y(c[1] + side[1]) }); }
    set(trail, { points: trailPts.join(" ") });
    document.getElementById("meter").style.width = Math.round(s * 100) + "%";
    drawMech();
    document.querySelectorAll("#steps li").forEach(function (li, i) { li.classList.toggle("now", i === step); });
    requestAnimationFrame(frame);
  }

  function setMode(m) {
    mode = m; motor = 0; clock = 0; chooHeld = false; chooFired = -9; tTurn = 0; tHooked = true; tLast = REST; tFired = -9; tTaut = false; phi = REST; omega = 0; free = false; flying = null; trailPts = []; step = 0;
    document.querySelectorAll("[data-mode]").forEach(function (b) { b.classList.toggle("on", b.dataset.mode === m); });
    document.getElementById("steps").innerHTML = MODES[m].steps.map(function (s) { return "<li>" + s + "</li>"; }).join("");
    document.getElementById("tip").textContent = MODES[m].tip;
  }
  document.querySelectorAll("[data-mode]").forEach(function (b) { b.onclick = function () { setMode(b.dataset.mode); }; });
  const slowBtn = document.getElementById("slow"), play = document.getElementById("play");
  slowBtn.onclick = function () { slow = !slow; slowBtn.classList.toggle("on", slow); };
  play.onclick = function () { playing = !playing; play.textContent = playing ? "❚❚ Pause" : "▶ Play"; };
  setMode(new URLSearchParams(location.search).get("mode") || "choo");
  requestAnimationFrame(frame);
</script>
</body>
</html>
